name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Built-in github-actions cannot be a ruleset bypass actor (GitHub limitation).
      # Create a private GitHub App, install it on this repo, add it to the
      # "Protect main" bypass list, then set vars.RELEASE_APP_ID +
      # secrets.RELEASE_APP_PRIVATE_KEY. Until then, releases use GITHUB_TOKEN
      # (works only while an admin bypasses or main is unprotected).
      - name: Mint release app token
        id: app-token
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm ≥ 11.5.1 required for Trusted Publishing OIDC.
          node-version: '24'
          cache: 'npm'
          # Do NOT set registry-url: it writes a fake NODE_AUTH_TOKEN into .npmrc
          # and breaks npm Trusted Publishing (OIDC).

      - name: Ensure npm for Trusted Publishing
        # Trusted Publishing needs npm ≥ 11.5.1; stage publish needs npm ≥ 12.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Semantic release
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          HUSKY: '0'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set +e
          npm run release
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "semantic-release failed (exit $status); retrying notes push…"
            sleep 5
            git for-each-ref --format='%(refname)' 'refs/notes/semantic-release-*' \
              | while read -r ref; do git push origin "$ref" || true; done
            exit "$status"
          fi
          set -e
          if [ -f .released-version ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat .released-version)" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.release.outputs.published == 'true'
        # Trusted Publisher (GitHub Actions) fields are case-sensitive:
        #   Organization or user: aixRun  (GitHub owner; NOT aixrun)
        #   Repository: n8n-nodes-textbee
        #   Workflow filename: ci.yml
        #   Environment: leave empty
        # Package name stays @aixrun/... — npm scopes cannot contain capitals.
        # After 2026-09-03, new Trusted Publishers default to allowing only
        # `npm stage publish`. Enable "Allow npm publish" on the package for
        # fully automated releases; otherwise CI stages and a maintainer
        # runs `npm stage approve <id>` (2FA) once.
        # Prefer OIDC (leave NPM_TOKEN unset). A token overrides OIDC.
        env:
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Warning: NPM_TOKEN is set; OIDC Trusted Publishing will not be used."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

          set +e
          npm publish
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Published to npm with provenance."
            exit 0
          fi

          echo "npm publish failed (exit $status)."
          echo "Falling back to npm stage publish (default Trusted Publisher permission)."
          npm stage publish
          echo "Staged successfully. Approve with: npm stage list && npm stage approve <stage-id>"
