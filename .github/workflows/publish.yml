# Optional tag-triggered republish path (e.g. manual tags or workflow re-runs).
# Normal releases publish from release.yml in the same job as semantic-release
# (avoids GITHUB_TOKEN not retriggering workflows).
#
# Starting May 1 2026, n8n requires community nodes to be published via GitHub
# Actions with npm provenance. This workflow satisfies that when it runs.
#
# Tag convention: semantic-release uses tagFormat `${version}` (e.g. 0.2.0),
# matching the filter below.
#
# Trusted Publisher: prefer release.yml for the main path. If you rely on this
# workflow, add publish.yml as a Trusted Publisher (or set NPM_TOKEN).

name: Publish

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish with provenance
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run publish:ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
