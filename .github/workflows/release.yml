name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required to mint an OIDC token for npm provenance attestation.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Semantic release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # GitHub sometimes rejects refs/notes right after the tag push. Retry that
          # push once so a clean job re-run can still finish after the tag landed.
          set +e
          npm run release
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "semantic-release failed (exit $status); retrying notes push…"
            sleep 5
            git for-each-ref --format='%(refname)' 'refs/notes/semantic-release-*' \
              | while read -r ref; do git push origin "$ref" || true; done
            exit "$status"
          fi
          set -e
          if [ -f .released-version ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat .released-version)" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.release.outputs.published == 'true'
        # Publishes in this same job so GITHUB_TOKEN tag pushes do not need to
        # re-trigger workflows. Register npm Trusted Publisher for release.yml,
        # or set NPM_TOKEN.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run publish:ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
